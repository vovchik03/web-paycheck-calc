<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/script.js" defer></script>
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> додати фавікон прикольний -->
    <title>PayCheck Calculator</title>
</head>
<body>
<main>
    <section class="header">
        <h1>Розрахунок витрат</h1>
        <!-- Блок вводу даних -->
        <input type="number" class="income" id="personA" placeholder="Person A">
        <input type="number" class="income" id="personB" placeholder="Person B">
        <input type="number" class="income" id="paycheck" placeholder="Amount to be paid">
    </section>
        <!-- Блок відображення результатів -->
         <article class="results">
            <h2>РЕЗУЛЬТАТ РОЗРАХУНКУ</h2>
            <div class="result" id="resultA">
                <label for="resultAOutput">Person A %:</label>
                <output id="resultAOutput">0</output>
            </div>
            <div class="result" id="resultB">
                <label for="resultBOutput">Person B %:</label>
                <output id="resultBOutput">0</output>
            </div>
             <div class="result" id="PartA">
                <label for="PartAOutput">Person A uah:</label>
                <output id="PartAOutput">0</output>
            </div>
             <div class="result" id="PartB">
                <label for="PartBOutput">Person B uah:</label>
                <output id="PartBOutput">0</output>
            </div>
        </article>

</main>


</body>
</html>
