<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/script.js" defer></script>
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> додати фавікон прикольний -->
    <title>PayCheck Calculator</title>
</head>
<body>
<main>
    <section class="header">
        <h1>Розрахунок витрат</h1>
        <!-- Блок вводу даних -->
        <div class="field-card">
            <svg class="field-icon" width="22" height="22" aria-hidden="true">
                <use href="#icon-doc"></use>
            </svg>
            <div class="field-text">
                <label for="personA">Дохід Особи A</label>
                <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]{0,2}" autocomplete="off" class="income" id="personA" placeholder="Напр: 25000">
            </div>
        </div>
        <div class="field-card">
            <svg class="field-icon" width="22" height="22" aria-hidden="true">
                <use href="#icon-doc"></use>
            </svg>
            <div class="field-text">
                <label for="personB">Дохід Особи Б</label>
                <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]{0,2}" autocomplete="off" class="income" id="personB" placeholder="Напр: 30000">
            </div>

        </div>
        <div class="field-card">
            <svg class="field-icon" width="22" height="22" aria-hidden="true">
                <use href="#icon-doc"></use>
            </svg>
            <div class="field-text">
                <label for="paycheck">Сума до виплати (&#8372;)</label>
                <input type="text" inputmode = "decimal" pattern="[0-9]*[.,]?[0-9]{0,2}" autocomplete="off" class="income" id="paycheck" placeholder="Напр: 15000.00">
                <span class="overload-text" id="paycheck-note" role="alert"></span>
            </div>
        </div>
        <div class ="button-calc-div">
            <button type="button" class="btn-calc" id="calcBtn"><span>ОБРОБИТИ ДАНІ</span>
            <svg class="check-mark" viewBox = "0 0 25 25" width="25" height="25" aria-hidden="true">
                <polyline points="1,12 8,19 20,3" class = "btn-calc-pl"/>
            </svg>
            </button>
        </div>
    </section>
        <!-- Блок відображення результатів -->
         <article class="results">
            <h2>РЕЗУЛЬТАТ РОЗРАХУНКУ</h2>
            <div class="result" id="resultA">
                <label for="resultAOutput">Особа A %:</label>
                <output id="resultAOutput">0</output>
            </div>
            <div class="result" id="resultB">
                <label for="resultBOutput">Особа B %:</label>
                <output id="resultBOutput">0</output>
            </div>
             <div class="result" id="PartA">
                <label for="PartAOutput">Особа A &#8372;:</label>
                <output id="PartAOutput">0</output>
            </div>
             <div class="result" id="PartB">
                <label for="PartBOutput">Особа B &#8372;:</label>
                <output id="PartBOutput">0</output>
            </div>
            <div class = "results-extra" id = "resultsExtra"></div>
        </article>
        <svg style = "display: none;">
            <symbol id="icon-doc" viewBox=" 0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="3" width="18" height="18" rx="4"/>
                <line x1="7" y1="8" x2="17" y2="8"/>
                <line x1="7" y1="12" x2="17" y2="12"/>
                <line x1="7" y1="16" x2="13" y2="16"/>
            </symbol>

        </svg>
        <!-- Photoshop-style Inner Shadow для заповненого сектора кола -->
        <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
            <filter id="pie-inner-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <!-- PS: Angle 90 / Distance 4px -->
                <feOffset in="SourceAlpha" dx="0" dy="0" result="pis-offset"/>
                <!-- PS: Size 6px -->
                <feGaussianBlur in="pis-offset" stdDeviation="7" result="pis-blur"/>
                <!-- те, що всередині фігури, але поза зміщеною копією = внутрішня тінь -->
                <feComposite in="SourceAlpha" in2="pis-blur" operator="out" result="pis-shape"/>
                <!-- PS: Color / Opacity -->
                <feFlood flood-color="#5c2d00" flood-opacity="0.55" result="pis-color"/>
                <feComposite in="pis-color" in2="pis-shape" operator="in" result="pis-shadow"/>
                <!-- PS: Blend Mode = Multiply -->
                <feBlend in="pis-shadow" in2="SourceGraphic" mode="multiply"/>
            </filter>
        </svg>
</main>


</body>
</html>
